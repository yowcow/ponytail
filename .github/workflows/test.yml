name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps for correctness checks
        run: pip install pandas

      - name: Install MCP deps
        run: npm install --prefix ponytail-mcp

      - name: Install Muse CLI for manifest validation
        run: |
          curl -fsSL https://dev.meta.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH only affects later steps; verify the binary here so a
          # moved install path fails loudly instead of silently skipping validation.
          export PATH="$HOME/.local/bin:$PATH"
          command -v muse

      - name: Debug muse validate (temporary)
        run: |
          command -v muse
          muse --version
          MUSE_EXPERIMENTAL_PLUGINS=on muse plugins validate . --json || echo "validate-exit=$?"

      - name: Check rule copies
        run: node scripts/check-rule-copies.js

      - name: Check version consistency
        run: node scripts/check-versions.js

      - name: Run tests
        run: npm test
